spring.application.name=ordering-system

# 1. Fixed the port syntax typo so Railway can inject its custom port
server.port=${PORT:8080}

# 2. Production Database Connection (Reads dynamically from Railway)
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. Hibernate Logic
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# 4. Telegram Production Configuration
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.group.id=-5231046740
telegram.chat.id=8604472105
telegram.bot.webhook=${TELEGRAM_WEBHOOK_URL}

# 5. WhatsApp Production Configuration (Linked to your permanent token variables)
whatsapp.access.token=${WHATSAPP_PRODUCTION_TOKEN}
whatsapp.mobile.id=1119625924570969